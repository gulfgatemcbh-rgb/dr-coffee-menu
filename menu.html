<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dr Coffee Menu</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: url('coffee-beans.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #3e2c23;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #fff;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    h2 {
      border-bottom: 2px solid #d4b59c;
      padding-bottom: 5px;
      margin-top: 30px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    h3 {
      margin-top: 15px;
      color: #f5e1d0;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      background: rgba(255, 248, 243, 0.9);
      margin: 5px 0;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    p {
      font-style: italic;
      color: #f5e1d0;
    }
    .menu-section {
      max-width: 600px;
      margin: auto;
      background: rgba(255,255,255,0.85);
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>☕ Dr Coffee Menu</h1>
  <div class="menu-section">
    <!-- Your menu items here (same as before) -->
  </div>
</body>
</html>
